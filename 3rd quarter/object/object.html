<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--OBJECT can have property example name, health, damage, etc-->
        <!--Collections of key-value pair or property name-->

    <script>
        //default property
        function player(health, speed, level) { //parameter
            this.health = 100; // this refers to the object:
            this.speed = 50;
            this.damage = 25; 
            //details for stats
            this.details = function() {
                return `Health: ${this.health},
                speed: ${this.speed},
                level: ${this.level}`;
            }
            this.attack = function(enemy) {
                enemy.health -= this.damage;
                return `Attacking enemy with damage: ${this.damage}, enemy health now: ${enemy.health}`;
            }
        }
        //Added nested object for players
        function armor(damage, durability) {
            this.damage = 10;
            this.durability = 50;
            this.bonushealth = 10;
        }

        //instance
        const player1 = new player();
        const player2 = new player()
        const armor1 = new armor(); 

        //Added armor in player1 
        player1.armor = armor1;
        //added player health with bonus health from armor
        player1.health += player1.armor.bonushealth;
        player1.damage += player1.armor.damage;

        //printing the stats and nested object
        console.log("player1", player1);
        console.log("player2", player2);

        //add property
        player1.armor = armor1
        player1.rage = 5;

        //method 
        player1.rage = function() {
            this.health += 20;
            this.damage += 10;
            return `After rage:
            health: ${this.health},
            damage: ${this.damage}`;
        }

        console.log(player1.details);
        console.log(player2.details);

        //delete property
        //delete player1.stamina;


        console.log(player1.attack(player2));
        //remmember = nested object




    </script>
</body>
</html>
